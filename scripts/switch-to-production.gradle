// Script to switch to production mode (JitPack)
// Usage: ./gradlew -b scripts/switch-to-production.gradle switchToProduction

task switchToProduction {
    doLast {
        def buildFile = file("app/build.gradle.kts")
        def content = buildFile.text
        
        // Replace local module with JitPack dependency
        content = content.replace(
            'implementation(project(":leaderboardscreenmodule"))',
            '// implementation(project(":leaderboardscreenmodule"))'
        )
        content = content.replace(
            '// implementation("com.github.yourusername:LeaderBoardDemo:1.0.0")',
            'implementation("com.github.yourusername:LeaderBoardDemo:1.0.0")'
        )
        
        buildFile.text = content
        println "Switched to production mode (JitPack)"
    }
} 